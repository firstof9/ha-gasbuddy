name: Pull actions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_PRERELEASE: allow

jobs:
  pre-commit:
    runs-on: "ubuntu-latest"
    name: Pre-commit
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v6

      - name: 🛠️ Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v7.1.0
        with:
          python-version: "3.14.2"

      - name: 🔍 Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # @v3.0.1

      - name: 🔍 Hassfest validation
        uses: "home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361"

      - name: 🔍 HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"
        with:
          category: integration

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    needs: pre-commit
    strategy:
      matrix:
        python-version:
          - "3.14.2"

    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v6

      - name: 🛠️ Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # @v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: 🛠️ Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: 📦 Install tox
        # We install tox as a tool with the necessary plugins
        run: uv tool install tox --with tox-uv --with tox-gh-actions --prerelease=allow

      - name: 🏃 Test with tox
        run: tox

      - name: 📤 Upload coverage to Codecov
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # @v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: "coverage.xml"

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v6
        with:
          fetch-depth: 2
      - name: 📥 Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # @v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: 📤 Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # @v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
