categories:
  - title: "Features"
    semver-increment: "minor"
    when:
      label: "feature"
  - title: "Bug Fixes"
    semver-increment: "patch"
    when:
      label: "fix"
  - type: "version-resolver"
    semverincrement: "major"
    when:
      label: "major"
  - type: "version-resolver"
    semverincrement: "patch"
    when:
      label: "fix"
